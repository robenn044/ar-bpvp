name: CHATOPS
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  command:
    name: command
    if: github.event.issue.pull_request && github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: resolve the pull request head at run time
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}             --jq '"RESOLVED_HEAD=" + .head.sha + " branch=" + .head.ref' | tee resolved.txt
      - name: fail so the retry rule can match
        run: exit 1
